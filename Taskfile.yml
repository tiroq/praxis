version: '3'

vars:
  CONTAINER_RUNTIME:
    sh: |
      if command -v container >/dev/null 2>&1; then
        echo container
      elif command -v podman >/dev/null 2>&1; then
        echo podman
      elif command -v docker >/dev/null 2>&1; then
        echo docker
      else
        echo "__missing__"
      fi

tasks:
  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  test:coverage:
    desc: Run all Go tests with coverage profile written to build/coverage.out
    cmds:
      - mkdir -p build
      - go test -coverprofile=build/coverage.out ./...

  test:storage:
    desc: Run storage layer tests (registry, eventstore, and sqlite)
    cmds:
      - go test -v ./internal/storage
      - go test -v ./internal/storage/eventstore/...
      - go test -v ./internal/storage/sqlite/...

  build:
    desc: Build all binaries into build/
    deps:
      - build:kernel-demo
      - build:praxis
      - build:api-kernel
      - build:worker
      - build:nats-smoke

  build:kernel-demo:
    desc: Build cmd/kernel-demo into build/kernel-demo
    cmds:
      - mkdir -p build
      - go build -o build/kernel-demo ./cmd/kernel-demo

  build:praxis:
    desc: Build cmd/praxis into build/praxis
    cmds:
      - mkdir -p build
      - go build -o build/praxis ./cmd/praxis

  build:api-kernel:
    desc: Build services/api-kernel into build/api-kernel
    cmds:
      - mkdir -p build
      - go build -o build/api-kernel ./services/api-kernel

  build:worker:
    desc: Build services/worker into build/worker
    cmds:
      - mkdir -p build
      - go build -o build/worker ./services/worker

  build:nats-smoke:
    desc: Build cmd/nats-smoke into build/nats-smoke
    cmds:
      - mkdir -p build
      - go build -o build/nats-smoke ./cmd/nats-smoke

  run:api-kernel:
    desc: Run api-kernel service
    cmds:
      - go run ./services/api-kernel

  run:kernel-demo:
    desc: 'Run kernel demo with default sample text: нужно купить билеты в Шанхай'
    deps:
      - build:kernel-demo
    cmds:
      - ./build/kernel-demo "нужно купить билеты в Шанхай"

  run:praxis:
    desc: Run praxis CLI help
    deps:
      - build:praxis
    cmds:
      - ./build/praxis --help

  run:worker:
    desc: Run the NATS worker service (requires NATS server)
    deps:
      - build:worker
    cmds:
      - go run ./services/worker

  run:nats:
    desc: Start local NATS JetStream
    preconditions:
      - sh: '[ "{{.CONTAINER_RUNTIME}}" != "__missing__" ]'
        msg: Neither podman nor docker is installed. Install Podman (preferred) or Docker.
    cmds:
      - |
        {{.CONTAINER_RUNTIME}} run -d \
          --name praxis-nats \
          -p 4222:4222 \
          -p 8222:8222 \
          nats:latest -js

  stop:nats:
    desc: Stop local NATS JetStream
    preconditions:
      - sh: '[ "{{.CONTAINER_RUNTIME}}" != "__missing__" ]'
        msg: Neither podman nor docker is installed. Install Podman (preferred) or Docker.
    cmds:
      - '{{.CONTAINER_RUNTIME}} rm -f praxis-nats || true'

  logs:nats:
    desc: Tail local NATS JetStream logs
    preconditions:
      - sh: '[ "{{.CONTAINER_RUNTIME}}" != "__missing__" ]'
        msg: Neither podman nor docker is installed. Install Podman (preferred) or Docker.
    cmds:
      - '{{.CONTAINER_RUNTIME}} logs -f praxis-nats'

  smoke:nats:
    desc: Run the real NATS JetStream smoke test through worker -> kernel -> output
    deps:
      - build
    cmds:
      - sh ./scripts/smoke_nats.sh

  smoke:praxis:
    desc: Run praxis CLI publish/watch smoke test over real NATS JetStream
    deps:
      - build
    cmds:
      - sh ./scripts/smoke_praxis.sh

  dev:
    desc: Full development verification — test, coverage, build, RFC hygiene
    cmds:
      - task: test
      - task: test:storage
      - task: test:coverage
      - task: build
      - task: verify:rfc

  report:
    desc: Run tests with coverage and write a human-readable summary to build/report.md
    cmds:
      - mkdir -p build
      - go test -coverprofile=build/coverage.out ./...
      - |
        go tool cover -func=build/coverage.out > build/coverage-func.txt
        TOTAL=$(tail -1 build/coverage-func.txt | awk '{print $3}')
        {
          echo 'mode: set'
          grep -E '/(cmd/praxis|internal/cli/praxiscli|internal/transport/natscli)/' build/coverage.out || true
        } > build/coverage-cli.out
        CLI_COVERAGE_NOTE="no CLI coverage entries"
        if [ "$(wc -l < build/coverage-cli.out | tr -d ' ')" -gt 1 ]; then
          go tool cover -func=build/coverage-cli.out > build/coverage-cli-func.txt
          CLI_COVERAGE_NOTE=$(tail -1 build/coverage-cli-func.txt | awk '{print $3}')
        else
          : > build/coverage-cli-func.txt
        fi
        {
          echo 'mode: set'
          grep -E '/internal/storage/' build/coverage.out || true
        } > build/coverage-storage.out
        STORAGE_COVERAGE_NOTE="no storage coverage entries"
        if [ "$(wc -l < build/coverage-storage.out | tr -d ' ')" -gt 1 ]; then
          go tool cover -func=build/coverage-storage.out > build/coverage-storage-func.txt
          STORAGE_COVERAGE_NOTE=$(tail -1 build/coverage-storage-func.txt | awk '{print $3}')
        else
          : > build/coverage-storage-func.txt
        fi
        BINARIES=$(ls -1 build/ 2>/dev/null | grep -v '\.' | tr '\n' ' ')
        RFC_STATUS="unknown"
        if python3 verify/rfc/run.py > /dev/null 2>&1; then RFC_STATUS="pass"; else RFC_STATUS="fail"; fi
        GRAPH_HEALTH_EXISTS="no"
        if [ -f graphify-out/graph_health.json ]; then GRAPH_HEALTH_EXISTS="yes"; fi
        GRAPH_NOTE=""
        if [ -f graphify-out/graph_health.json ]; then
          GRAPH_NOTE=$(python3 -c "
        import json, sys
        try:
            d = json.load(open('graphify-out/graph_health.json'))
            print('Graph nodes: ' + str(d.get('total_nodes', d.get('node_count', '?'))) + ', edges: ' + str(d.get('total_edges', d.get('edge_count', '?'))))
        except Exception as e:
            print('graph_health.json parse error: ' + str(e))
        ")
        fi
        NATS_SMOKE_NOTE="not run"
        if [ -f build/smoke-nats.json ]; then
          NATS_SMOKE_NOTE=$(python3 -c "
        import json
        try:
            d = json.load(open('build/smoke-nats.json'))
            ok = 'yes' if d.get('worker_flow_ok') else 'no'
            print('run=' + ok + ', status=' + str(d.get('received', {}).get('status', 'unknown')) + ', input_event_id=' + str(d.get('received', {}).get('input_event_id', '?')))
        except Exception as e:
            print('parse error: ' + str(e))
        ")
        fi
        PRAXIS_SMOKE_NOTE="not run"
        if [ -f build/smoke-praxis.json ]; then
          PRAXIS_SMOKE_NOTE=$(python3 -c "
        import json
        try:
            d = json.load(open('build/smoke-praxis.json'))
            ok = 'yes' if d.get('worker_flow_ok') else 'no'
            published = d.get('published', {})
            received = d.get('received', {})
            print('run=' + ok + ', status=' + str(received.get('status', 'unknown')) + ', message_id=' + str(published.get('message_id', '?')) + ', correlation_id=' + str(published.get('correlation_id', '?')))
        except Exception as e:
            print('parse error: ' + str(e))
        ")
        fi
        {
          echo "# Praxis Build Report"
          echo ""
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo ""
          echo "## Test Status"
          echo ""
          echo "All tests passed (see coverage.out for details)."
          echo ""
          echo "## Coverage Summary"
          echo ""
          echo "\`\`\`"
          cat build/coverage-func.txt | grep -E "^(github|total)" | tail -20
          echo "\`\`\`"
          echo ""
          echo "**Total coverage:** $TOTAL"
          echo ""
          echo "## CLI Coverage Summary"
          echo ""
          echo "\`\`\`"
          if [ -s build/coverage-cli-func.txt ]; then
            cat build/coverage-cli-func.txt | grep -E "^(github|total)"
          else
            echo "no CLI coverage entries"
          fi
          echo "\`\`\`"
          echo ""
          echo "**CLI coverage:** $CLI_COVERAGE_NOTE"
          echo ""
          echo "## Storage Coverage Summary"
          echo ""
          echo "\`\`\`"
          if [ -s build/coverage-storage-func.txt ]; then
            cat build/coverage-storage-func.txt | grep -E "^(github|total)"
          else
            echo "no storage coverage entries"
          fi
          echo "\`\`\`"
          echo ""
          echo "**Storage coverage:** $STORAGE_COVERAGE_NOTE"
          echo ""
          echo "## Built Binaries"
          echo ""
          echo "| Binary | Path |"
          echo "|--------|------|"
          for b in $BINARIES; do echo "| $b | build/$b |"; done
          echo ""
          echo "## RFC Hygiene"
          echo ""
          echo "Status: **$RFC_STATUS**"
          echo ""
          echo "## Graph Health"
          echo ""
          echo "graph_health.json exists: **$GRAPH_HEALTH_EXISTS**"
          echo ""
          if [ -n "$GRAPH_NOTE" ]; then
            echo "$GRAPH_NOTE"
            echo ""
          fi
          echo "## NATS Smoke"
          echo ""
          echo "Smoke result: **$NATS_SMOKE_NOTE**"
          echo ""
          echo "## Praxis CLI Smoke"
          echo ""
          echo "Smoke result: **$PRAXIS_SMOKE_NOTE**"
          echo ""
          echo "## Notes"
          echo ""
          echo "- Kernel is transport-agnostic (no NATS imports in internal/core/kernel)."
          echo "- NATS unit tests use fakes — no real NATS server required for task test."
          echo "- Real NATS smoke is exercised by task smoke:nats and task smoke:praxis."
        } > build/report.md
        echo "Report written to build/report.md"
        cat build/report.md

  clean:
    desc: Remove build/
    cmds:
      - rm -rf build/

  verify:rfc:
    desc: Run RFC verification scripts
    cmds:
      - python3 verify/rfc/run.py

  graph:rebuild:
    desc: Rebuild the graphify knowledge graph
    cmds:
      - python3 scripts/rebuild_graph.py
